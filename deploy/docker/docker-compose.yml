name: bkcrab

services:
  bkcrab:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bkcrab/bkcrab:local
    restart: unless-stopped
    # Forward DNS to public resolvers instead of Docker Desktop's embedded
    # resolver, which intermittently returns "server misbehaving" (SERVFAIL)
    # under bursty lookups and breaks LLM/provider and web_fetch requests.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${BKCRAB_PORT:-18953}:18953"
    volumes:
      - bkcrab-data:/data/.bkcrab
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      BKCRAB_HOME: /data/.bkcrab
      BKCRAB_BIND: all
      BKCRAB_PORT: "18953"
      BKCRAB_STORAGE_TYPE: mysql
      BKCRAB_STORAGE_DSN: "bkcrab:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/docker/.env}@tcp(mysql:3306)/bkcrab?parseTime=true&loc=UTC&charset=utf8mb4"
      BKCRAB_STORAGE_AUTO_MIGRATE: "true"
      # Keep legacy claimant as the development default. A fair rollout must
      # first deploy every replica with workerMode=paused, drain it, and only
      # then change both values to true/fair in a second deployment.
      BKCRAB_FAIR_QUEUE_ENABLED: "${FAIR_QUEUE_ENABLED:-false}"
      BKCRAB_FAIR_QUEUE_MYSQL_WRITER_TOPOLOGY: single
      BKCRAB_RAG_INDEX_WORKER_MODE: "${RAG_INDEX_WORKER_MODE:-legacy}"
      # Image batches use their own three-state rollout gate. legacy keeps the
      # synchronous tool; drain keeps status/cancel/workers but rejects create;
      # fair enables durable create. Promote only legacy -> drain -> fair.
      BKCRAB_IMAGEGEN_BATCH_MODE: "${IMAGEGEN_BATCH_MODE:-legacy}"
      BKCRAB_IMAGEGEN_MAX_IMAGES_PER_BATCH: "${IMAGEGEN_MAX_IMAGES_PER_BATCH:-16}"
      BKCRAB_IMAGEGEN_MAX_IMAGES_PER_TASK: "${IMAGEGEN_MAX_IMAGES_PER_TASK:-4}"
      BKCRAB_IMAGEGEN_TOOL_WAIT_DEFAULT: "${IMAGEGEN_TOOL_WAIT_DEFAULT:-180s}"
      BKCRAB_IMAGEGEN_TOOL_WAIT_MAX: "${IMAGEGEN_TOOL_WAIT_MAX:-240s}"
      BKCRAB_IMAGEGEN_PROMPT_MAX_RUNES: "${IMAGEGEN_PROMPT_MAX_RUNES:-8000}"
      BKCRAB_IMAGEGEN_REQUEST_MAX_BYTES: "${IMAGEGEN_REQUEST_MAX_BYTES:-131072}"
      BKCRAB_IMAGEGEN_IMAGE_MAX_BYTES: "${IMAGEGEN_IMAGE_MAX_BYTES:-20971520}"
      BKCRAB_IMAGEGEN_BATCH_MAX_BYTES: "${IMAGEGEN_BATCH_MAX_BYTES:-134217728}"
      BKCRAB_IMAGEGEN_LOCAL_WORKERS: "${IMAGEGEN_LOCAL_WORKERS:-4}"
      BKCRAB_IMAGEGEN_GLOBAL_CONCURRENCY: "${IMAGEGEN_GLOBAL_CONCURRENCY:-4}"
      BKCRAB_IMAGEGEN_PER_USER_BASE_CONCURRENCY: "${IMAGEGEN_PER_USER_BASE_CONCURRENCY:-2}"
      BKCRAB_IMAGEGEN_PER_USER_BURST_CONCURRENCY: "${IMAGEGEN_PER_USER_BURST_CONCURRENCY:-4}"
      BKCRAB_IMAGEGEN_BORROW_ENABLED: "${IMAGEGEN_BORROW_ENABLED:-true}"
      BKCRAB_IMAGEGEN_TASK_LEASE: "${IMAGEGEN_TASK_LEASE:-180s}"
      BKCRAB_IMAGEGEN_TASK_HEARTBEAT: "${IMAGEGEN_TASK_HEARTBEAT:-30s}"
      BKCRAB_IMAGEGEN_RESERVATION_TTL: "${IMAGEGEN_RESERVATION_TTL:-180s}"
      BKCRAB_IMAGEGEN_RESERVATION_HEARTBEAT: "${IMAGEGEN_RESERVATION_HEARTBEAT:-30s}"
      BKCRAB_IMAGEGEN_PREPARE_TIMEOUT: "${IMAGEGEN_PREPARE_TIMEOUT:-10s}"
      BKCRAB_IMAGEGEN_PROVISIONAL_TTL: "${IMAGEGEN_PROVISIONAL_TTL:-15s}"
      BKCRAB_IMAGEGEN_PROCESSING_TTL: "${IMAGEGEN_PROCESSING_TTL:-15s}"
      BKCRAB_IMAGEGEN_PUBLISH_ATTEMPT_TIMEOUT: "${IMAGEGEN_PUBLISH_ATTEMPT_TIMEOUT:-15s}"
      BKCRAB_IMAGEGEN_RECOVERY_DRAIN_TIMEOUT: "${IMAGEGEN_RECOVERY_DRAIN_TIMEOUT:-120s}"
      BKCRAB_IMAGEGEN_DISPATCH_INTERVAL: "${IMAGEGEN_DISPATCH_INTERVAL:-1s}"
      BKCRAB_IMAGEGEN_RECONCILE_INTERVAL: "${IMAGEGEN_RECONCILE_INTERVAL:-30s}"
      BKCRAB_IMAGEGEN_EXPIRED_SWEEP_INTERVAL: "${IMAGEGEN_EXPIRED_SWEEP_INTERVAL:-15s}"
      BKCRAB_IMAGEGEN_RECONCILE_PAGE_SIZE: "${IMAGEGEN_RECONCILE_PAGE_SIZE:-200}"
      BKCRAB_IMAGEGEN_MAX_RETRIES: "${IMAGEGEN_MAX_RETRIES:-3}"
      BKCRAB_IMAGEGEN_PROVIDER_CALL_TIMEOUT: "${IMAGEGEN_PROVIDER_CALL_TIMEOUT:-120s}"
      BKCRAB_IMAGEGEN_ARTIFACT_DOWNLOAD_TIMEOUT: "${IMAGEGEN_ARTIFACT_DOWNLOAD_TIMEOUT:-60s}"
      BKCRAB_IMAGEGEN_PROVIDER_CONCURRENCY_DEFAULT: "${IMAGEGEN_PROVIDER_CONCURRENCY_DEFAULT:-4}"
      BKCRAB_OBJECT_STORE_TYPE: minio
      BKCRAB_OBJECT_STORE_ENDPOINT: minio:9000
      BKCRAB_OBJECT_STORE_BUCKET: "${MINIO_BUCKET:-bkcrab}"
      BKCRAB_OBJECT_STORE_PREFIX: "${MINIO_PREFIX:-}"
      BKCRAB_OBJECT_STORE_ACCESSKEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/docker/.env}"
      BKCRAB_OBJECT_STORE_SECRETKEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/docker/.env}"
      BKCRAB_OBJECT_STORE_USESSL: "false"
      BKCRAB_MCP_GATEWAY_IMAGE: "${BKCRAB_MCP_GATEWAY_IMAGE:-ghcr.io/lucky-aeon/mcp-gateway:latest}"
      DOCKER_HOST: tcp://sandbox-docker:2375
    depends_on:
      mysql:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      sandbox-docker:
        condition: service_healthy
      sandbox-image-init:
        condition: service_completed_successfully
      mcp-gateway-image-init:
        condition: service_completed_successfully
    command: ["gateway"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18953/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: bkcrab
      MYSQL_USER: bkcrab
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/docker/.env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/docker/.env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u bkcrab -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/docker/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/docker/.env}"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/docker/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/docker/.env}"
      MINIO_BUCKET: "${MINIO_BUCKET:-bkcrab}"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  sandbox-docker:
    image: docker:28-dind
    privileged: true
    restart: unless-stopped
    # The inner Docker daemon is the runtime for agent sandbox containers.
    # Use stable upstream DNS instead of inheriting Docker Desktop's
    # intermittently flaky embedded resolver.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DOCKER_TLS_CERTDIR: ""
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,sandbox-docker}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,sandbox-docker}"
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - bkcrab-data:/data/.bkcrab
      - sandbox-docker-data:/var/lib/docker
    # Runtime PID and socket files must not survive a DinD container restart.
    tmpfs:
      - /var/run
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 30

  sandbox-image-init:
    image: docker:28-dind
    restart: "no"
    depends_on:
      sandbox-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://sandbox-docker:2375
      SANDBOX_IMAGE: "${BKCRAB_SANDBOX_IMAGE:-qs3c/bkcrab-sandbox:latest}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,sandbox-docker}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,sandbox-docker}"
    volumes:
      - ./sandbox:/sandbox:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        host_docker="docker --host unix:///var/run/docker.sock"
        dind_docker="docker --host tcp://sandbox-docker:2375"

        if $${dind_docker} image inspect "$${SANDBOX_IMAGE}" >/dev/null 2>&1; then
          echo "==> sandbox image already present in DinD: $${SANDBOX_IMAGE}"
        else
          if ! $${host_docker} image inspect "$${SANDBOX_IMAGE}" >/dev/null 2>&1; then
            if [ ! -f /sandbox/Dockerfile ]; then
              echo "sandbox image missing on host Docker and /sandbox/Dockerfile was not mounted"
              echo "prepare $${SANDBOX_IMAGE} on the host Docker daemon, or restore deploy/docker/sandbox/Dockerfile"
              exit 1
            fi

            echo "==> sandbox image missing on host Docker; building on host: $${SANDBOX_IMAGE}"
            $${host_docker} build \
              --build-arg HTTP_PROXY="$${HTTP_PROXY:-}" \
              --build-arg HTTPS_PROXY="$${HTTPS_PROXY:-}" \
              --build-arg NO_PROXY="$${NO_PROXY:-}" \
              --build-arg http_proxy="$${http_proxy:-}" \
              --build-arg https_proxy="$${https_proxy:-}" \
              --build-arg no_proxy="$${no_proxy:-}" \
              -t "$${SANDBOX_IMAGE}" \
              /sandbox
          fi

          echo "==> loading sandbox image into DinD: $${SANDBOX_IMAGE}"
          $${host_docker} save "$${SANDBOX_IMAGE}" | $${dind_docker} load
        fi

        echo "==> verifying sandbox image has Python"
        $${dind_docker} run --rm "$${SANDBOX_IMAGE}" python --version

  mcp-gateway-image-init:
    image: docker:28-dind
    restart: "no"
    depends_on:
      sandbox-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://sandbox-docker:2375
      MCP_GATEWAY_IMAGE: "${BKCRAB_MCP_GATEWAY_IMAGE:-ghcr.io/lucky-aeon/mcp-gateway:latest}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,sandbox-docker}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,sandbox-docker}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        host_docker="docker --host unix:///var/run/docker.sock"
        dind_docker="docker --host tcp://sandbox-docker:2375"

        if $${dind_docker} image inspect "$${MCP_GATEWAY_IMAGE}" >/dev/null 2>&1; then
          echo "==> MCP gateway image already present in DinD: $${MCP_GATEWAY_IMAGE}"
        else
          if ! $${host_docker} image inspect "$${MCP_GATEWAY_IMAGE}" >/dev/null 2>&1; then
            echo "==> MCP gateway image missing on host Docker; pulling: $${MCP_GATEWAY_IMAGE}"
            $${host_docker} pull "$${MCP_GATEWAY_IMAGE}"
          fi

          echo "==> loading MCP gateway image into DinD: $${MCP_GATEWAY_IMAGE}"
          $${host_docker} save "$${MCP_GATEWAY_IMAGE}" | $${dind_docker} load
        fi

        echo "==> verifying MCP gateway image"
        $${dind_docker} image inspect "$${MCP_GATEWAY_IMAGE}" >/dev/null

  migrate-storage:
    profiles: ["migration"]
    image: bkcrab/bkcrab:local
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./.state:/migration:ro
    entrypoint: ["bkcrab-migrate-storage"]
    command:
      - --sqlite
      - /migration/bkcrab.db
      - --mysql
      - "bkcrab:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/docker/.env}@tcp(mysql:3306)/bkcrab?parseTime=true&loc=UTC&charset=utf8mb4"
      - --replace

volumes:
  bkcrab-data:
  mysql-data:
  minio-data:
  sandbox-docker-data:
