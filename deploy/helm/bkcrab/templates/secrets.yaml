apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bkcrab.fullname" . }}-secrets
  labels:
    {{- include "bkcrab.labels" . | nindent 4 }}
type: Opaque
stringData:
  STORAGE_DSN: {{ include "bkcrab.dsn" . | quote }}
  {{- if .Values.fairQueue.enabled }}
  {{- if .Values.redis.enabled }}
  FAIR_QUEUE_REDIS_PASSWORD: {{ required "redis.password is required when built-in Redis fairqueue is enabled" .Values.redis.password | quote }}
  {{- else }}
  FAIR_QUEUE_REDIS_PASSWORD: {{ required "redis.password is required when external Redis fairqueue is enabled" .Values.redis.password | quote }}
  {{- end }}
  {{- if .Values.rabbitmq.enabled }}
  FAIR_QUEUE_RABBITMQ_PASSWORD: {{ required "rabbitmq.password is required when built-in RabbitMQ is enabled" .Values.rabbitmq.password | quote }}
  FAIR_QUEUE_RABBITMQ_URL: {{ printf "amqp://%s:%s@%s-rabbitmq:5672/%s" .Values.rabbitmq.username (required "rabbitmq.password is required when built-in RabbitMQ is enabled" .Values.rabbitmq.password) (include "bkcrab.fullname" .) .Values.rabbitmq.vhost | quote }}
  {{- else }}
  FAIR_QUEUE_RABBITMQ_URL: {{ required "rabbitmq.url is required when external RabbitMQ fairqueue is enabled" .Values.rabbitmq.url | quote }}
  {{- end }}
  {{- end }}
  {{- if and (ne .Values.objectStore.type "local") .Values.objectStore.accessKey }}
  OBJECT_STORE_ACCESSKEY: {{ .Values.objectStore.accessKey | quote }}
  OBJECT_STORE_SECRETKEY: {{ .Values.objectStore.secretKey | quote }}
  {{- end }}
  {{- if and .Values.sandbox.enabled .Values.sandbox.e2bApiKey }}
  E2B_API_KEY: {{ .Values.sandbox.e2bApiKey | quote }}
  {{- end }}
  {{- if and .Values.rag.enabled .Values.rag.milvus.username }}
  RAG_MILVUS_USERNAME: {{ .Values.rag.milvus.username | quote }}
  RAG_MILVUS_PASSWORD: {{ .Values.rag.milvus.password | quote }}
  {{- end }}
  {{- if and .Values.rag.enabled .Values.rag.embedding.apiKey }}
  RAG_EMBEDDING_API_KEY: {{ .Values.rag.embedding.apiKey | quote }}
  {{- end }}
  {{- if and .Values.rag.enabled .Values.rag.reranker.apiKey }}
  RAG_RERANKER_API_KEY: {{ .Values.rag.reranker.apiKey | quote }}
  {{- end }}
  {{- if and .Values.rag.enabled .Values.rag.documentAI.apiKey }}
  DOCUMENT_AI_API_KEY: {{ .Values.rag.documentAI.apiKey | quote }}
  {{- end }}
