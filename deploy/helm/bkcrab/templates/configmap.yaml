apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bkcrab.fullname" . }}-config
  labels:
    {{- include "bkcrab.labels" . | nindent 4 }}
data:
  BKCRAB_PORT: {{ .Values.gateway.port | quote }}
  BKCRAB_BIND: "all"
  BKCRAB_STORAGE_TYPE: {{ include "bkcrab.storageType" . | quote }}
  BKCRAB_STORAGE_AUTO_MIGRATE: "true"

  ## Fairqueue infrastructure and rollout state. Credentials/AMQP URL are in
  ## Secret. Imagegen requires redisMode=standalone and
  ## mysqlWriterTopology=single; neither Redis Cluster nor multi-writer is safe.
  BKCRAB_FAIR_QUEUE_ENABLED: {{ .Values.fairQueue.enabled | quote }}
  {{- if .Values.redis.enabled }}
  BKCRAB_FAIR_QUEUE_REDIS_ADDR: {{ printf "%s-redis:6379" (include "bkcrab.fullname" .) | quote }}
  {{- else }}
  BKCRAB_FAIR_QUEUE_REDIS_ADDR: {{ .Values.redis.address | quote }}
  {{- end }}
  BKCRAB_FAIR_QUEUE_REDIS_DB: {{ .Values.fairQueue.redisDB | quote }}
  BKCRAB_FAIR_QUEUE_REDIS_MODE: {{ .Values.fairQueue.redisMode | quote }}
  BKCRAB_FAIR_QUEUE_EXCHANGE: {{ .Values.fairQueue.exchange | quote }}
  BKCRAB_FAIR_QUEUE_DEAD_LETTER_EXCHANGE: {{ .Values.fairQueue.deadLetterExchange | quote }}
  BKCRAB_FAIR_QUEUE_KEY_PREFIX: {{ .Values.fairQueue.keyPrefix | quote }}
  BKCRAB_FAIR_QUEUE_MYSQL_WRITER_TOPOLOGY: {{ .Values.fairQueue.mysqlWriterTopology | quote }}
  BKCRAB_RAG_INDEX_WORKER_MODE: {{ .Values.fairQueue.ragIndex.workerMode | quote }}
  BKCRAB_RAG_INDEX_LOCAL_WORKERS: {{ .Values.fairQueue.ragIndex.localWorkers | quote }}
  BKCRAB_RAG_INDEX_GLOBAL_CONCURRENCY: {{ .Values.fairQueue.ragIndex.globalConcurrency | quote }}
  BKCRAB_RAG_INDEX_PER_USER_BASE_CONCURRENCY: {{ .Values.fairQueue.ragIndex.perUserBaseConcurrency | quote }}
  BKCRAB_RAG_INDEX_PER_USER_BURST_CONCURRENCY: {{ .Values.fairQueue.ragIndex.perUserBurstConcurrency | quote }}
  BKCRAB_RAG_INDEX_BORROW_ENABLED: {{ .Values.fairQueue.ragIndex.borrowEnabled | quote }}

  ## Image generation uses the same shared fairqueue infrastructure but an
  ## independent resource namespace and rollout mode.
  BKCRAB_IMAGEGEN_BATCH_MODE: {{ .Values.imagegenBatch.mode | quote }}
  BKCRAB_IMAGEGEN_MAX_IMAGES_PER_BATCH: {{ .Values.imagegenBatch.maxImagesPerBatch | quote }}
  BKCRAB_IMAGEGEN_MAX_IMAGES_PER_TASK: {{ .Values.imagegenBatch.maxImagesPerTask | quote }}
  BKCRAB_IMAGEGEN_TOOL_WAIT_DEFAULT: {{ .Values.imagegenBatch.toolWaitDefault | quote }}
  BKCRAB_IMAGEGEN_TOOL_WAIT_MAX: {{ .Values.imagegenBatch.toolWaitMax | quote }}
  BKCRAB_IMAGEGEN_PROMPT_MAX_RUNES: {{ .Values.imagegenBatch.promptMaxRunes | quote }}
  BKCRAB_IMAGEGEN_REQUEST_MAX_BYTES: {{ .Values.imagegenBatch.requestMaxBytes | quote }}
  BKCRAB_IMAGEGEN_IMAGE_MAX_BYTES: {{ .Values.imagegenBatch.imageMaxBytes | quote }}
  BKCRAB_IMAGEGEN_BATCH_MAX_BYTES: {{ .Values.imagegenBatch.batchMaxBytes | quote }}
  BKCRAB_IMAGEGEN_LOCAL_WORKERS: {{ .Values.imagegenBatch.localWorkers | quote }}
  BKCRAB_IMAGEGEN_GLOBAL_CONCURRENCY: {{ .Values.imagegenBatch.globalConcurrency | quote }}
  BKCRAB_IMAGEGEN_PER_USER_BASE_CONCURRENCY: {{ .Values.imagegenBatch.perUserBaseConcurrency | quote }}
  BKCRAB_IMAGEGEN_PER_USER_BURST_CONCURRENCY: {{ .Values.imagegenBatch.perUserBurstConcurrency | quote }}
  BKCRAB_IMAGEGEN_BORROW_ENABLED: {{ .Values.imagegenBatch.borrowEnabled | quote }}
  BKCRAB_IMAGEGEN_TASK_LEASE: {{ .Values.imagegenBatch.taskLease | quote }}
  BKCRAB_IMAGEGEN_TASK_HEARTBEAT: {{ .Values.imagegenBatch.taskHeartbeat | quote }}
  BKCRAB_IMAGEGEN_RESERVATION_TTL: {{ .Values.imagegenBatch.reservationTTL | quote }}
  BKCRAB_IMAGEGEN_RESERVATION_HEARTBEAT: {{ .Values.imagegenBatch.reservationHeartbeat | quote }}
  BKCRAB_IMAGEGEN_PREPARE_TIMEOUT: {{ .Values.imagegenBatch.prepareTimeout | quote }}
  BKCRAB_IMAGEGEN_PROVISIONAL_TTL: {{ .Values.imagegenBatch.provisionalTTL | quote }}
  BKCRAB_IMAGEGEN_PROCESSING_TTL: {{ .Values.imagegenBatch.processingTTL | quote }}
  BKCRAB_IMAGEGEN_PUBLISH_ATTEMPT_TIMEOUT: {{ .Values.imagegenBatch.publishAttemptTimeout | quote }}
  BKCRAB_IMAGEGEN_RECOVERY_DRAIN_TIMEOUT: {{ .Values.imagegenBatch.recoveryDrainTimeout | quote }}
  BKCRAB_IMAGEGEN_DISPATCH_INTERVAL: {{ .Values.imagegenBatch.dispatchInterval | quote }}
  BKCRAB_IMAGEGEN_RECONCILE_INTERVAL: {{ .Values.imagegenBatch.reconcileInterval | quote }}
  BKCRAB_IMAGEGEN_EXPIRED_SWEEP_INTERVAL: {{ .Values.imagegenBatch.expiredSweepInterval | quote }}
  BKCRAB_IMAGEGEN_RECONCILE_PAGE_SIZE: {{ .Values.imagegenBatch.reconcilePageSize | quote }}
  BKCRAB_IMAGEGEN_MAX_RETRIES: {{ .Values.imagegenBatch.maxRetries | quote }}
  BKCRAB_IMAGEGEN_PROVIDER_CALL_TIMEOUT: {{ .Values.imagegenBatch.providerCallTimeout | quote }}
  BKCRAB_IMAGEGEN_PROVIDER_CONCURRENCY_DEFAULT: {{ .Values.imagegenBatch.providerConcurrencyDefault | quote }}
  {{- if .Values.rag.enabled }}

  ## RAG 基础服务与独立 feature gates
  BKCRAB_RAG_MILVUS_ADDRESS: {{ .Values.rag.milvus.address | quote }}
  BKCRAB_RAG_EMBEDDING_ENDPOINT: {{ .Values.rag.embedding.endpoint | quote }}
  BKCRAB_RAG_EMBEDDING_MODEL: {{ .Values.rag.embedding.model | quote }}
  BKCRAB_RAG_EMBEDDING_DIMS: {{ .Values.rag.embedding.dims | quote }}
  BKCRAB_RAG_RERANKER_ENABLED: {{ .Values.rag.reranker.enabled | quote }}
  BKCRAB_RAG_RERANKER_ENDPOINT: {{ .Values.rag.reranker.endpoint | quote }}
  BKCRAB_RAG_RERANKER_MODEL: {{ .Values.rag.reranker.model | quote }}
  BKCRAB_RAG_RERANKER_TIMEOUT_MS: {{ .Values.rag.reranker.timeoutMS | quote }}
  BKCRAB_RAG_RERANKER_CANDIDATE_TOP_K: {{ .Values.rag.reranker.candidateTopK | quote }}
  BKCRAB_RAG_RERANKER_MIN_SCORE: {{ .Values.rag.reranker.minScore | quote }}
  BKCRAB_RAG_ADVANCED_ENABLED: {{ .Values.rag.advancedEnabled | quote }}
  BKCRAB_RAG_OFFICE_ENABLED: {{ .Values.rag.officeEnabled | quote }}
  BKCRAB_RAG_ENRICHMENT_ENABLED: {{ .Values.rag.enrichmentEnabled | quote }}
  {{- if .Values.rag.parser.enabled }}
  BKCRAB_RAG_PARSER_ENDPOINT: {{ printf "http://%s-rag-parser:%v" (include "bkcrab.fullname" .) .Values.rag.parser.port | quote }}
  BKCRAB_RAG_PARSER_TIMEOUT_MS: {{ .Values.rag.limits.parseTimeoutMS | quote }}
  {{- end }}

  ## DocumentAI 非 secret 配置；API key 只通过 Secret 注入 gateway。
  BKCRAB_RAG_DOCUMENT_AI_API_TYPE: {{ .Values.rag.documentAI.apiType | quote }}
  BKCRAB_RAG_DOCUMENT_AI_ENDPOINT: {{ .Values.rag.documentAI.endpoint | quote }}
  BKCRAB_RAG_DOCUMENT_AI_VISION_MODEL: {{ .Values.rag.documentAI.visionModel | quote }}
  BKCRAB_RAG_DOCUMENT_AI_TEXT_MODEL: {{ .Values.rag.documentAI.textModel | quote }}
  BKCRAB_RAG_DOCUMENT_AI_ALLOWED_ENDPOINT_HOSTS: {{ .Values.rag.documentAI.allowedEndpointHosts | quote }}
  BKCRAB_RAG_DOCUMENT_AI_ALLOW_PRIVATE_ENDPOINT: {{ .Values.rag.documentAI.allowPrivateEndpoint | quote }}

  ## Gateway 与 parser 共用的运行时限制来源。
  BKCRAB_RAG_LIMITS_MAX_FILE_MB: {{ .Values.rag.limits.maxFileMB | quote }}
  BKCRAB_RAG_LIMITS_MAX_PAGES_PER_DOCUMENT: {{ .Values.rag.limits.maxPagesPerDocument | quote }}
  BKCRAB_RAG_LIMITS_MAX_ASSETS_PER_DOCUMENT: {{ .Values.rag.limits.maxAssetsPerDocument | quote }}
  BKCRAB_RAG_LIMITS_MAX_ASSET_BYTES: {{ .Values.rag.limits.maxAssetBytes | quote }}
  BKCRAB_RAG_LIMITS_MAX_EXTRACTED_BYTES: {{ .Values.rag.limits.maxExtractedBytes | quote }}
  BKCRAB_RAG_LIMITS_MAX_IMAGE_PIXELS: {{ .Values.rag.limits.maxImagePixels | quote }}
  BKCRAB_RAG_LIMITS_PDF_RENDER_DPI: {{ .Values.rag.limits.pdfRenderDPI | quote }}
  BKCRAB_RAG_LIMITS_PARSE_TIMEOUT_MS: {{ .Values.rag.limits.parseTimeoutMS | quote }}
  {{- end }}
  {{- with .Values.timezone }}
  ## 服务器默认时区 — 聊天/agent/系统偏好之后的最后回退。
  TZ: {{ . | quote }}
  {{- end }}

  ## 对象存储
  BKCRAB_OBJECT_STORE_TYPE: {{ .Values.objectStore.type | quote }}
  {{- with .Values.objectStore.bucket }}
  BKCRAB_OBJECT_STORE_BUCKET: {{ . | quote }}
  {{- end }}
  {{- with .Values.objectStore.region }}
  BKCRAB_OBJECT_STORE_REGION: {{ . | quote }}
  {{- end }}
  {{- with .Values.objectStore.endpoint }}
  BKCRAB_OBJECT_STORE_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.objectStore.accountId }}
  BKCRAB_OBJECT_STORE_ACCOUNTID: {{ . | quote }}
  {{- end }}
  {{- with .Values.objectStore.prefix }}
  BKCRAB_OBJECT_STORE_PREFIX: {{ . | quote }}
  {{- end }}
  BKCRAB_OBJECT_STORE_USESSL: {{ .Values.objectStore.useSSL | quote }}
  {{- if .Values.objectStore.aliyunInternal }}
  BKCRAB_OBJECT_STORE_ALIYUN_INTERNAL: "true"
  {{- end }}

  ## 沙箱
  {{- if .Values.sandbox.enabled }}
  BKCRAB_SANDBOX_BACKEND: {{ .Values.sandbox.backend | quote }}
  {{- with .Values.sandbox.image }}
  BKCRAB_SANDBOX_IMAGE: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- with .Values.extraEnv }}
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
