{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bkcrab.fullname" . }}-redis
  labels:
    {{- include "bkcrab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{ include "bkcrab.fullname" . }}-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bkcrab.fullname" . }}-redis
  labels:
    {{- include "bkcrab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bkcrab.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "bkcrab.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "bkcrab.fullname" . }}-redis
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: redis
        image: {{ .Values.redis.image | quote }}
        args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bkcrab.fullname" . }}-secrets
              key: FAIR_QUEUE_REDIS_PASSWORD
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        readinessProbe:
          exec:
            command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.redis.storage }}
{{- end }}
