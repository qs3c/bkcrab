global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bkcrab
    static_configs:
      - targets: ["bkcrab:18954"]
    sample_limit: 50000
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
