[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bkcrab-parser-eval-renderer"
version = "0.1.0"
description = "Isolated Office-to-page renderer for bkcrab parser evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pymupdf==1.26.4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "openpyxl==3.1.5",
  "pytest>=8.3,<9",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "ruff>=0.11,<1",
]

[project.scripts]
parser-eval-renderer = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
