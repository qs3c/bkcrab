[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bkcrab-rag-evaluator"
version = "0.1.0"
description = "Network-isolated Ragas scoring sidecar for bkcrab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "langchain-community==0.3.31",
  "langchain-core==0.3.78",
  "openai==2.53.0",
  "pydantic==2.13.4",
  "ragas==0.3.9",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.16.1"]

[project.scripts]
rag-evaluator = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
